name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Vue and Node checks
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check source
        run: npm run check

      - name: Run server tests
        run: npm test

      - name: Build production artifacts
        run: npm run build

      - name: Build the runtime image
        run: docker build --tag make-duel-go-brrr:test .

      - name: Validate Compose configuration
        run: docker compose config --quiet
